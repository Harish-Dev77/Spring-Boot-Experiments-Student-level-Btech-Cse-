<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Notifications (SSE)</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #messages { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll; background: #f9f9f9; }
        .msg { margin-bottom: 5px; padding: 5px; background: #d4edda; border-left: 4px solid #28a745; }
    </style>
</head>
<body>
    <h2>Live Notifications</h2>
    <p>Waiting for server to push notifications...</p>
    <div id="messages"></div>

    <script>
        const messagesDiv = document.getElementById('messages');
        
        // Connect to the SSE endpoint
        const eventSource = new EventSource('/api/notifications/subscribe');
        
        // Listen for events named "notification"
        eventSource.addEventListener('notification', function(event) {
            const newMsg = document.createElement('div');
            newMsg.className = 'msg';
            newMsg.innerText = "New Notification: " + event.data;
            messagesDiv.prepend(newMsg);
        });

        eventSource.onerror = function() {
            console.error("Connection lost. Trying to reconnect...");
        };
    </script>
</body>
</html>
